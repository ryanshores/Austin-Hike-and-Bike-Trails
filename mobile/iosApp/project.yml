name: AtlasMobile
options:
  bundleIdPrefix: us.ryanshores.atlas
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: ""
targets:
  AtlasMobile:
    type: application
    platform: iOS
    sources:
      - path: AtlasMobile
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: us.ryanshores.atlas.mobile
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Austin Atlas
        FRAMEWORK_SEARCH_PATHS: "$(inherited) $(SRCROOT)/../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"
        OTHER_LDFLAGS: "$(inherited) -framework AtlasShared"
    preBuildScripts:
      - name: Build Kotlin framework
        script: |
          cd "$SRCROOT/.."
          if [ "$CONFIGURATION" != "Debug" ]; then
            echo "Only the Debug framework is configured in this initial scaffold." >&2
            exit 1
          fi
          if [ "$SDK_NAME" = "iphoneos" ]; then
            ./gradlew :shared:copyDebugIosArm64FrameworkForXcode
          elif echo "$ARCHS" | grep -q x86_64; then
            ./gradlew :shared:copyDebugIosX64FrameworkForXcode
          else
            ./gradlew :shared:copyDebugIosSimulatorArm64FrameworkForXcode
          fi
        basedOnDependencyAnalysis: false
