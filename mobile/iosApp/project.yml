name: AtlasMobile
options:
  bundleIdPrefix: us.ryanshores.atlas
  xcodeVersion: "26.5"
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: 77H7V8G86J
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"
    STRING_CATALOG_GENERATE_SYMBOLS: YES
targets:
  AtlasMobile:
    type: application
    platform: iOS
    sources:
      - path: AtlasMobile
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: us.ryanshores.atlas.mobile
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Austin Atlas
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.navigation
        FRAMEWORK_SEARCH_PATHS: "$(inherited) $(SRCROOT)/../shared/build/xcode-frameworks/$(CONFIGURATION)/$(PLATFORM_NAME)"
        OTHER_LDFLAGS: "$(inherited) -framework AtlasShared -lsqlite3"
    preBuildScripts:
      - name: Build Kotlin framework
        script: |
          cd "$SRCROOT/.."
          if [ "$CONFIGURATION" != "Debug" ]; then
            echo "Only the Debug framework is configured in this initial scaffold." >&2
            exit 1
          fi
          if [ "$PLATFORM_NAME" = "iphoneos" ]; then
            ./gradlew :shared:copyDebugIosArm64FrameworkForXcode
          elif echo "$ARCHS" | grep -q x86_64; then
            ./gradlew :shared:copyDebugIosX64FrameworkForXcode
          else
            ./gradlew :shared:copyDebugIosSimulatorArm64FrameworkForXcode
          fi
        basedOnDependencyAnalysis: false
  AtlasMobileTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: AtlasMobileTests
    settings:
      base:
        FRAMEWORK_SEARCH_PATHS: "$(inherited) $(SRCROOT)/../shared/build/xcode-frameworks/$(CONFIGURATION)/$(PLATFORM_NAME)"
        GENERATE_INFOPLIST_FILE: YES
        OTHER_LDFLAGS: "$(inherited) -framework AtlasShared -lsqlite3"
    dependencies:
      - target: AtlasMobile
