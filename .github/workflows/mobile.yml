name: Mobile

on:
  pull_request:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile.yml'
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile.yml'

jobs:
  ios-simulator:
    name: Unsigned iOS Simulator build
    runs-on: macos-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Run shared Kotlin tests
        run: |
          if [ "$(uname -m)" = arm64 ]; then
            ./gradlew :shared:iosSimulatorArm64Test
          else
            ./gradlew :shared:iosX64Test
          fi
      - name: Compile shared Android target
        run: ./gradlew :shared:compileAndroidMain
      - name: Build the SwiftUI host without signing
        run: |
          xcodebuild -project iosApp/AtlasMobile.xcodeproj -scheme AtlasMobile \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            ARCHS="$(uname -m)" CODE_SIGNING_ALLOWED=NO build
